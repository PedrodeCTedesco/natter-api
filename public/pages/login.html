<!DOCTYPE html>
<html
    lang="en">
<head>
    <title>Natter!</title>
    <script type="text/javascript" src="../js/login.js"></script>
    <style type="text/css">
        input {
            margin-right: 100%
        }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form id="login">
        <label>
            Username: <input name="username" type="text" id="username">
        </label>
        <label>
            Password: <input name="password" type="password" id="password">
        </label>
        <button type="submit">Login</button>
    </form>
</body>
</html>
